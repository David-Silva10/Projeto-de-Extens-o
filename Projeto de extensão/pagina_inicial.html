<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página Inicial - Sorveteria Doce Vidal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- David -->
    <header>
        <a href="index.html">
            <img src="Assets/watermarked_img_13313892341618406340.jpg" alt="Logo Sorveteria Doce Vidal">
        </a>
        <div class="secoes">
            <a href="produto.html?id=sorvetes"><h5>Sabores de Sorvetes</h5></a>
            <a href="produto.html?id=caldas"><h5>Caldas</h5></a>
            <a href="produto.html?id=bebidas"><h5>Bebidas</h5></a>
            <a href="produto.html?id=crepes"><h5>Opções de Crepes</h5></a>
            <a href="produto.html?id=acompanhamentos"><h5>Acompanhamentos</h5></a>
        </div>
    </header>

    <!-- ========================= -->

    <main class="main1">
        <!-- Seção Nossos Produtos (preenchida pelo produtos.json) -->
        <section class="secao-catalogo">
            <h2 class="titulo-secao">Nossos Produtos</h2>
            <div id="grade-cards" class="grade-produtos"></div>
        </section>

        <!-- Mapa da Sorveteria -->
        <div class="container1">
            <iframe src="https://www.google.com/maps/embed?pb=!1m14!1m8!1m3!1d3542.4623505860477!2d-49.3632969!3d-27.3925017!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x94df77b16756b52d%3A0xac229bec2230af98!2sSorveteria%20Doce%20Vidal!5e0!3m2!1spt-BR!2sbr!4v1794868559625!5m2!1spt-BR!2sbr" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
        </div>
    </main>

    <!-- =================== -->
     
    <footer>

    </footer>

    <!-- Script da Página Inicial: gera os cards a partir do produtos.json -->
    <script>
        fetch('produtos.json')
            .then(res => res.json())
            .then(dados => {
                const grade = document.getElementById('grade-cards');

                Object.keys(dados).forEach(id => {
                    const item = dados[id];
                    grade.innerHTML += `
                        <div class="card">
                            <img src="${item.imagem}" alt="${item.titulo}">
                            <div class="card-conteudo">
                                <h3>${item.titulo}</h3>
                                <span class="preco">${item.preco}</span>
                                <a href="produto.html?id=${id}" class="botao-card">Ver detalhes</a>
                            </div>
                        </div>
                    `;
                });
            })
            .catch(erro => console.error("Erro ao carregar produtos.json:", erro));
    </script>
</body>
</html>
