<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carrossel - Sorveteria Doce Vida</title>

  <!-- 1. ESTILO (CSS) -->
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #fff5f7; /* Fundo rosado suave */
      margin: 0;
      padding: 20px;
    }

    /* Caixa principal que segura a foto e as setas */
    .carrossel-container {
      position: relative;
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
    }

    /* Imagem do sorvete */
    #foto-destaque {
      width: 100%;
      height: 350px;       /* Altura no celular */
      object-fit: cover;   /* Ajusta a foto sem esticar */
      display: block;
    }

    /* Legenda na parte de baixo da foto */
    .legenda-foto {
      position: absolute;
      bottom: 0;
      width: 100%;
      background: linear-gradient(transparent, rgba(0, 0, 0, 0.75));
      color: white;
      padding: 20px 16px 12px;
      font-size: 18px;
      font-weight: bold;
      box-sizing: border-box;
    }

    /* Botões das Setas */
    .seta {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background-color: rgba(255, 255, 255, 0.85);
      color: #5c3a21;      /* Marrom chocolate */
      border: none;
      width: 40px;
      height: 40px;
      font-size: 20px;
      font-weight: bold;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
      transition: 0.2s;
    }

    .seta:hover {
      background-color: #ffffff;
      transform: translateY(-50%) scale(1.1);
    }

    .seta-esquerda { left: 12px; }
    .seta-direita { right: 12px; }

    /* Ajuste de altura para telas de computador */
    @media (min-width: 768px) {
      #foto-destaque {
        height: 450px;
      }
    }
  </style>
</head>
<body>

  <!-- 2. ESTRUTURA (HTML) -->
  <div class="carrossel-container">
    <!-- Botão Voltar -->
    <button class="seta seta-esquerda" onclick="mudarFoto(-1)">&#10094;</button>

    <!-- Foto que muda dinamicamente (coloquei imagens de exemplo da web para testar na hora) -->
    <img id="foto-destaque" src="https://images.unsplash.com/photo-1563805042-7684c019e1cb?w=800" alt="Destaque Sorveteria">

    <!-- Texto descritivo sobre a foto -->
    <div id="texto-legenda" class="legenda-foto">Taça Especial de Chocolate</div>

    <!-- Botão Avançar -->
    <button class="seta seta-direita" onclick="mudarFoto(1)">&#10095;</button>
  </div>

  <!-- 3. FUNCIONAMENTO DAS SETAS (JAVASCRIPT) -->
  <script>
    // Troque os links abaixo pelos caminhos das fotos da sua pasta (ex: "img/pistache.jpg")
    const slides = [
      {
        imagem: "https://images.unsplash.com/photo-1563805042-7684c019e1cb?w=800",
        titulo: "Taça Especial de Chocolate"
      },
      {
        imagem: "https://images.unsplash.com/photo-1501443762994-82bd5dace89a?w=800",
        titulo: "Sorvete Artesanal de Morango"
      },
      {
        imagem: "https://images.unsplash.com/photo-1497034825429-c343d7c6a68f?w=800",
        titulo: "Casquinha Crocante Doce Vida"
      }
    ];

    let indiceAtual = 0;

    function mudarFoto(direcao) {
      indiceAtual += direcao;

      // Volta para o início se passar da última foto
      if (indiceAtual >= slides.length) {
        indiceAtual = 0;
      }
      // Vai para a última foto se clicar para voltar na primeira
      if (indiceAtual < 0) {
        indiceAtual = slides.length - 1;
      }

      // Atualiza a imagem e a legenda na tela
      document.getElementById("foto-destaque").src = slides[indiceAtual].imagem;
      document.getElementById("texto-legenda").innerText = slides[indiceAtual].titulo;
    }
  </script>

</body>
</html>
